<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Snippet Auditor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000'/%3E%3Cpath d='M8 11l5 5-5 5M15 22h9' stroke='%23fff' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>

<div class="boot is-landing" id="boot" data-state="info">
  <div class="boot-card" role="status" aria-live="polite">
    <div class="logo" aria-hidden="true">&gt;_</div>
    <p class="boot-title" id="bootTitle">Loading project…</p>
    <p class="boot-text" id="bootText" hidden></p>
    <button class="btn-sm" id="bootRetry" type="button" hidden>Try again</button>
  </div>
</div>
<div class="app" id="app" hidden></div>
<script>
  document.getElementById('bootTitle').textContent = 'Open your project link';
  var t = document.getElementById('bootText');
  t.hidden = false;
  t.textContent = 'Snippet Auditor projects are opened from a private access link, such as /project/your-project/dev?token=… or /project/your-project/qa?token=…';
</script>
</body>
</html>
